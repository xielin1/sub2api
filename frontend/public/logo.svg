<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Aphelion</title>
  <desc id="desc">An orbit with a planet at its aphelion, the far point from the sun.</desc>
  <style>
    /* Transparent background: the ring adapts so it stays legible on light and dark surfaces. */
    .ring { stroke: #33322d; }
    .sun { fill: #33322d; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #f3f1ea; }
      .sun { fill: #f3f1ea; }
    }
  </style>
  <g transform="rotate(-27 256 256)">
    <ellipse
      class="ring"
      cx="256"
      cy="256"
      rx="200"
      ry="124"
      fill="none"
      stroke-width="38"
    />
    <circle class="sun" cx="57" cy="268" r="22" />
    <circle cx="432" cy="192" r="50" fill="#d66b4d" />
  </g>
</svg>
