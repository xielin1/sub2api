name: Sync official upstream into mine

# 1. 直接合并官方 main，保留 mine 的补丁历史；冲突或验证失败时不推送。
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-mine
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mine
        uses: actions/checkout@v6
        with:
          ref: mine
          fetch-depth: 0

      - name: Merge official upstream
        id: merge
        run: |
          set -euo pipefail
          # 1. 获取官方主线，已包含的更新无需重复验证或推送。
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2. 普通合并保留已有提交，冲突直接令本次同步失败。
          git config user.name "upstream-sync-bot"
          git config user.email "upstream-sync-bot@users.noreply.github.com"
          git merge --no-edit upstream/main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Verify backend
        if: steps.merge.outputs.changed == 'true'
        working-directory: backend
        run: |
          go build ./...
          go test -tags=unit ./...

      - name: Verify frontend
        if: steps.merge.outputs.changed == 'true'
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build
          make test-frontend-critical

      - name: Push merged mine
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:mine
